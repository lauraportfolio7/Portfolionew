server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hashed assets — immutable cache (1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts — long cache
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Documents PDF — cache long + requêtes Range (ouverture page par page)
    location /documents/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # Pages du livret (guide investisseur) pré-rendues en images — cache long
    location /guide-pages/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Diaporama & questionnaire Disney pré-rendus en images — cache long
    location /disney-diapo/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location /disney-questionnaire/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html — no cache
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
